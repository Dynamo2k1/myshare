name: Release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the frontend (embedded into the binary)
        working-directory: web
        run: npm ci && npm run build

      - name: Cross-compile all targets
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist-bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            out="dist-bin/myshare-${os}-${arch}${ext}"
            echo "building $out"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/myshare
          done
          ( cd dist-bin && sha256sum * > SHA256SUMS )
          ls -la dist-bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true # review, then hit "Publish"
          generate_release_notes: true
          files: |
            dist-bin/myshare-*
            dist-bin/SHA256SUMS
